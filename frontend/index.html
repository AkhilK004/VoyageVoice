<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoyageVoice — AI Travel Assistant</title>
  <meta name="description" content="Talk to Aria, your AI-powered travel and visa assistant by Atlys." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <main class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">✈</span>
        <span class="logo-text">VoyageVoice</span>
      </div>
      <span class="powered-by">Powered by Atlys AI</span>
    </header>

    <!-- Agent Avatar -->
    <section class="agent-section">
      <div class="avatar-container" id="avatar-container">
        <div class="avatar-ring" id="avatar-ring"></div>
        <div class="avatar" id="avatar">
          <span class="avatar-emoji">🧳</span>
        </div>
        <div class="agent-name">Aria</div>
        <div class="agent-role">Travel AI Assistant</div>
      </div>

      <!-- Status Badge -->
      <div class="status-badge" id="status-badge">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Ready to connect</span>
      </div>
    </section>

    <!-- Transcript Feed -->
    <section class="transcript-section">
      <div class="transcript-feed" id="transcript-feed">
        <div class="transcript-placeholder">
          <span>Your conversation will appear here</span>
        </div>
      </div>
    </section>

    <!-- Controls -->
    <section class="controls">
      <button class="btn-call" id="btn-call" onclick="toggleCall()">
        <span class="btn-icon" id="btn-icon">📞</span>
        <span class="btn-label" id="btn-label">Start Call</span>
      </button>
      <div class="latency-strip" id="latency-strip" style="display:none">
        <span class="latency-item">STT <b id="stt-latency">—</b>ms</span>
        <span class="latency-divider">|</span>
        <span class="latency-item">E2E <b id="e2e-latency">—</b>ms</span>
      </div>
    </section>
  </main>

  <script src="/static/js/audio.js"></script>
  <script src="/static/js/ui.js"></script>
</body>
</html>
